name: Build Dhaka Heralds

on:
  push:
    branches: [main]
    paths:
      - 'dhaka-heralds/**'
  pull_request:
    branches: [main]
    paths:
      - 'dhaka-heralds/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dhaka-heralds

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dhaka-heralds/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Create Netlify zip
        run: cd dist && zip -r ../dhaka-heralds-netlify.zip .

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dhaka-heralds-dist
          path: dhaka-heralds/dist/
          retention-days: 30

      - name: Upload Netlify zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: dhaka-heralds-netlify
          path: dhaka-heralds/dhaka-heralds-netlify.zip
          retention-days: 30
